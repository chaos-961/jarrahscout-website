<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1513" media="(prefers-color-scheme: dark)">
<title>Jarrah Scouts Timeline Map</title>

<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://basemaps.cartocdn.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

<div class="app">

  <header class="bar">
    <div class="bar__row bar__row--top">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11Z"/>
            <circle cx="12" cy="10" r="2.6"/>
          </svg>
        </span>
        <span class="brand__text">
          <b>Jarrah Scouts</b>
          <i>Timeline map</i>
        </span>
      </div>

      <div class="ctrls">
        <button class="btn btn--icon" id="prevBtn" type="button" title="Previous year" aria-label="Previous year">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg>
        </button>
        <button class="btn btn--play" id="playBtn" type="button" title="Play timeline" aria-label="Play timeline" aria-pressed="false">
          <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a.8.8 0 0 0 1.22.68l10.9-6.8a.8.8 0 0 0 0-1.36L9.22 4.52A.8.8 0 0 0 8 5.2Z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.3"/><rect x="13.5" y="5" width="4" height="14" rx="1.3"/></svg>
        </button>
        <button class="btn btn--icon" id="nextBtn" type="button" title="Next year" aria-label="Next year">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>

    <div class="bar__row bar__row--rail">
      <div class="year" aria-hidden="true">
        <span class="year__num" id="yearNum">0000</span>
        <span class="year__meta" id="yearMeta">sample data</span>
      </div>

      <div class="rail" id="rail" tabindex="0" role="slider"
           aria-label="Year" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="">
        <div class="rail__track"><div class="rail__fill" id="railFill"></div></div>
        <div class="rail__ticks" id="railTicks"></div>
        <div class="rail__thumb" id="railThumb"><span></span></div>
        <div class="rail__labels" id="railLabels"></div>
      </div>
    </div>
  </header>

  <main class="stage">
    <div id="map" class="map"></div>

    <div class="overlay overlay--bl">
      <div class="chip" id="countChip"><span class="chip__dot"></span><span id="countText">—</span></div>
    </div>

    <div class="overlay overlay--br">
      <button class="fab" id="homeBtn" type="button" title="Reset view" aria-label="Reset view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="5.2"/>
        </svg>
      </button>
    </div>

    <div class="boot" id="boot"><div class="boot__spin"></div></div>
  </main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/config.js?v=1"></script>
<script src="js/data.js?v=1"></script>
<script src="js/map.js?v=1"></script>
<script src="js/timeline.js?v=1"></script>
<script src="js/app.js?v=1"></script>
</body>
</html>
